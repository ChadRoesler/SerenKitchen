[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seren-kitchen"
dynamic = ["version"]
description = "The kitchen: a fridge per Seren app, magnets for whoever holds it, and the notes we leave each other."
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Chad Roesler" }, { name = "Wren Marginalia" }]
readme = "README.md"
keywords = ["seren", "fridge", "notes", "board", "fastapi", "viewer"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # the shell, auth, config, update checking
    "seren-meninges>=6.0.0,<7",
    # the request log
    "seren-sinew>=5.7.0,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0"]

[project.scripts]
seren-kitchen = "seren_kitchen.__main__:main"

[project.urls]
Homepage = "https://github.com/ChadRoesler/SerenKitchen"
Repository = "https://github.com/ChadRoesler/SerenKitchen"
"Bug Tracker" = "https://github.com/ChadRoesler/SerenKitchen/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["seren_kitchen*"]

# Without this the viewer's .html/.css/.js are absent from the wheel, and /viewer
# 500s on an installed copy while working from the checkout.
[tool.setuptools.package-data]
seren_kitchen = ["viewer/ui/*.html", "viewer/ui/*.css", "viewer/ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools_scm]
root = ".."
version_scheme = "release-branch-semver"
version_file = "seren_kitchen/_version.py"
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"
fallback_version = "0.0.0.dev0"
